<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Contábil Pro - Enterprise Cloud</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Configurações do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBlFT-G4T6aC3QNPPsnMEJ7Lb16jW0v4FU",
            authDomain: "gestaopro-9fac3.firebaseapp.com",
            projectId: "gestaopro-9fac3",
            storageBucket: "gestaopro-9fac3.firebasestorage.app",
            messagingSenderId: "880162078551",
            appId: "1:880162078551:web:eb5ec03e32b41918ab8812",
            measurementId: "G-Y6PV08VE87",
            databaseURL: "https://gestaopro-9fac3-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Funções Cloud
        window.salvarNoCloud = (caminho, dado) => push(ref(db, caminho), dado);

        onValue(ref(db, '/'), (snapshot) => {
            window.dadosGlobais = snapshot.val() || { usuarios: {}, tarefas: {} };
            renderizarTudo();
        });
    </script>

    <style>
        :root { --primary: #002D62; --danger: #dc3545; --success: #28a745; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* Login */
        #tela-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* Container Principal */
        .container { max-width: 1400px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; display: none; }
        .header { background: #333; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; }
        
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 12px; border-bottom: 2px solid #ddd; text-align: left; color: #555; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; }
        .restricted { display: none !important; }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <h2 style="color:var(--primary); margin-bottom: 25px;">Gestão Pro - Acesso</h2>
            <input type="email" id="l-email" placeholder="E-mail Corporativo">
            <input type="password" id="l-senha" placeholder="Senha">
            <button class="btn-primary" onclick="tentarLogin()">Entrar</button>
            <p id="msg-erro" style="color:red; font-size:12px; margin-top: 15px;"></p>
        </div>
    </div>

    <div id="app" class="container">
        <div class="header">
            <span id="user-display" style="font-weight: bold;">Bem-vindo</span>
            <button onclick="location.reload()" style="width: auto; background: none; color: white; border: 1px solid white; padding: 5px 15px;">Sair do Sistema</button>
        </div>

        <div class="grid">
            <aside id="menu-lateral">
                <div class="card" id="area-equipe">
                    <h3>👥 Gestão de Equipe</h3>
                    <input type="text" id="nu-nome" placeholder="Nome Completo">
                    <input type="email" id="nu-email" placeholder="E-mail">
                    <input type="password" id="nu-senha" placeholder="Definir Senha">
                    <select id="nu-tipo">
                        <option value="EQUIPE">Equipe Operacional</option>
                        <option value="LIDER">Líder de Unidade</option>
                        <option value="GERENTE" id="opt-gerente">Gerente</option>
                        <option value="CLIENTE">Cliente</option>
                    </select>
                    <select id="nu-unidade">
                        <option>Serviços Corporativos</option>
                        <option>Gestão de Ativos</option>
                        <option>Projetos de Capital</option>
                        <option>Administrativo</option>
                        <option>Marketing</option>
                        <option>Recursos Humanos</option>
                    </select>
                    <button class="btn-primary" onclick="cadastrarUsuario()">Cadastrar na Nuvem</button>
                </div>

                <div class="card" id="area-tarefas">
                    <h3>📅 Programar Atividade</h3>
                    <input type="text" id="t-nome" placeholder="Nome da Tarefa">
                    <input type="date" id="t-data">
                    <input type="number" id="t-horas" placeholder="Horas (Max 8h/dia)">
                    <select id="t-resp"></select>
                    <button class="btn-primary" style="background:var(--success)" onclick="programarTarefa()">Salvar Cronograma</button>
                </div>
            </aside>

            <main>
                <div class="card">
                    <h3>Monitoramento de Prazos e Equipe</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Prazo</th>
                                <th>Tarefa</th>
                                <th>Responsável</th>
                                <th>Unidade</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="lista-atividades"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script>
    let usuarioLogado = null;

    function tentarLogin() {
        const email = document.getElementById('l-email').value;
        const senha = document.getElementById('l-senha').value;

        // Login Admin Inicial (Segurança de primeiro uso)
        if(email === "admin@admin.com" && senha === "admin123") {
            usuarioLogado = { nome: "Administrador Geral", tipo: "ADMIN", unidade: "Todas", email: email };
            permitirAcesso();
            return;
        }

        const usuarios = window.dadosGlobais.usuarios;
        for (let id in usuarios) {
            if (usuarios[id].email === email && usuarios[id].senha === senha) {
                usuarioLogado = usuarios[id];
                permitirAcesso();
                return;
            }
        }
        document.getElementById('msg-erro').innerText = "Credenciais inválidas ou usuário não cadastrado.";
    }

    function permitirAcesso() {
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('user-display').innerText = `${usuarioLogado.nome} | ${usuarioLogado.unidade}`;
        
        // Bloqueios de Hierarquia
        if(usuarioLogado.tipo === 'EQUIPE') {
            document.getElementById('menu-lateral').classList.add('restricted');
        }
        if(usuarioLogado.tipo === 'GERENTE') {
            document.getElementById('opt-gerente').classList.add('restricted');
        }
        renderizarTudo();
    }

    function cadastrarUsuario() {
        const novo = {
            nome: document.getElementById('nu-nome').value,
            email: document.getElementById('nu-email').value,
            senha: document.getElementById('nu-senha').value,
            tipo: document.getElementById('nu-tipo').value,
            unidade: document.getElementById('nu-unidade').value
        };
        if(!novo.nome || !novo.email || !novo.senha) return alert("Preencha todos os campos.");
        window.salvarNoCloud('usuarios/', novo);
        alert("Usuário cadastrado com sucesso!");
    }

    function programarTarefa() {
        const t = {
            nome: document.getElementById('t-nome').value,
            data: document.getElementById('t-data').value,
            horas: parseFloat(document.getElementById('t-horas').value) || 0,
            resp: document.getElementById('t-resp').value,
            status: "Pendente"
        };

        if(!t.nome || !t.data || !t.resp) return alert("Preencha os dados da tarefa.");

        // Regra das 8h/dia
        const tarefas = window.dadosGlobais.tarefas;
        let somaHoras = 0;
        for(let id in tarefas) {
            if(tarefas[id].resp === t.resp && tarefas[id].data === t.data) somaHoras += tarefas[id].horas;
        }
        
        if(somaHoras + t.horas > 8) {
            alert(`⚠️ ALERTA: O profissional já possui ${somaHoras}h agendadas para este dia. O limite é 8h.`);
            return;
        }

        window.salvarNoCloud('tarefas/', t);
        alert("Tarefa agendada e sincronizada na nuvem!");
    }

    function renderizarTudo() {
        if(!usuarioLogado) return;

        // Atualizar lista de responsáveis
        const sel = document.getElementById('t-resp');
        sel.innerHTML = '<option value="">Selecione o Responsável...</option>';
        const users = window.dadosGlobais.usuarios;
        for(let id in users) {
            if(users[id].tipo !== 'CLIENTE') {
                sel.innerHTML += `<option value="${users[id].nome}">${users[id].nome} (${users[id].unidade})</option>`;
            }
        }

        // Atualizar Tabela
        const lista = document.getElementById('lista-atividades');
        lista.innerHTML = "";
        const tarefas = window.dadosGlobais.tarefas;
        
        for(let id in tarefas) {
            const t = tarefas[id];
            const hoje = new Date().toISOString().split('T')[0];
            const isAtrasado = (hoje > t.data && t.status !== 'Concluído');
            
            lista.innerHTML += `
                <tr>
                    <td>${t.data}</td>
                    <td>${t.nome}</td>
                    <td>${t.resp}</td>
                    <td>Fiscal</td>
                    <td>
                        <span class="badge" style="background:${isAtrasado ? 'var(--danger)' : 'var(--success)'}">
                            ${isAtrasado ? 'ATRASADO' : t.status}
                        </span>
                    </td>
                </tr>`;
        }
    }
</script>
</body>
</html>
